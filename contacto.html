<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Ferretería Los Maestros</title>
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>
<body>
    <a class="salto-contenido" href="#contenido-principal">Ir al contenido</a>

    <header class="cabecera-sitio">
        <a class="marca" href="index.html">Ferretería Los Maestros</a>
        <button id="boton-menu" class="boton-menu" type="button" aria-label="Abrir o cerrar menú principal" aria-controls="menu-principal" aria-expanded="false">
            <span aria-hidden="true">☰</span>
        </button>

        <nav id="menu-principal" class="menu" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blogs.html">Blogs</a>
            <a href="contacto.html" aria-current="page">Contacto</a>
            <a href="login.html">Iniciar Sesión</a>
            <a href="registro.html">Registrarse</a>
            <a href="carrito.html">🛒 Carrito (<span id="contador-carrito">0</span>)</a>
        </nav>
    </header>

    <main id="contenido-principal">
        <header class="encabezado-pagina">
            <p class="etiqueta">Atención al Cliente</p>
            <h1>Formulario de Contacto</h1>
        </header>

        <form class="formulario" action="confirmacion.html" method="get">
            <fieldset>
                <legend>Tus Mensajes</legend>

                <label for="nombre-contacto">Nombre completo</label>
                <input id="nombre-contacto" name="nombre" type="text" maxlength="100" required>

                <label for="correo-contacto">Correo electrónico</label>
                <input id="correo-contacto" name="correo" type="email" maxlength="100" required>

                <label for="comentario">Comentario o Consulta</label>
                <textarea id="comentario" name="comentario" rows="5" maxlength="500" required></textarea>
            </fieldset>

            <button type="submit">Enviar Mensaje</button>
        </form>
    </main>

    <footer class="pie-sitio">
        <p><strong>Ferretería Los Maestros</strong></p>
        <address>Contacto: <a href="mailto:contacto@losmaestros.cl">contacto@losmaestros.cl</a></address>
        <p><small>Proyecto académico · Desarrollo FullStack II (DSY1104)</small></p>
    </footer>

    <script src="assets/js/menu.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
